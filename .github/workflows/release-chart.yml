name: Release the Logicle Chart
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      chartVersion:
        description: "Chart version (required for experimental releases)"

env:
  REGISTRY: ghcr.io
  REPO_NAME: ${{ github.event.repository.name }}
  REPO_OWNER: ${{github.repository_owner}}

jobs:
  build-and-push-helm-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: lowercase github.repository_owner
        run: |
          echo "REPO_OWNER=`echo ${{github.repository_owner}} | tr '[:upper:]' '[:lower:]'`" >>${GITHUB_ENV}

      - name: Resolve chart version
        id: version
        run: |
          RAW="${{ github.event.inputs.chartVersion || github.event.release.tag_name }}"
          echo "tag=${RAW#v}" >> $GITHUB_OUTPUT

      - name: Lint helm chart
        run: helm lint charts/logicle

      - uses: ./.github/actions/helm-oci-chart-releaser
        with:
          name: logicle
          repository: ${{ env.REPO_OWNER }}
          tag: ${{ steps.version.outputs.tag }}
          path: charts/logicle
          registry: ${{ env.REGISTRY }}
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          update_dependencies: true
